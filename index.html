<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <script src ="javascripts/index.js"></script>
        <style>
            .name {
                font-family: Arial;
                color: white;
                position: absolute;
                top: 50%;
                left: 10%;

                @media only screen and (max-width: 720px) {
                    top: 50%;
                }
            }
            .icons {
                font-family: Arial;
                color: white;
                position: absolute;
                top: 25%;
                right: 10%;
                line-height: 2.5;
            }
            .projects-button {
                color: inherit;
                text-decoration: none;
            }
            .projects-button:hover{
                color:green;
            }
            div.absolute {
                position: absolute;
                margin: 0;
                padding: 0;
                bottom: 0;
                right: 0;
                width: 100%;
                height: 100%;
                z-index: -1;
                object-fit: cover;
            }
        </style>
        <meta charset="UTF-8">
    </head>
    <body>
        <h1 class="name"> Jefferson Mauricio Almeida-Pires</h1>
        <h2 class="icons">
            <i class="fa-solid fa-circle-user"></i>
            About Me<br>
            <i class="fa-solid fa-book"></i>
            Resume<br>
            <a class = "projects-button" href = "project.html" target = " blank" rel = "noopener noreferrer">
                <i class="fa-solid fa-gamepad"></i>
                Projects<br>
            </a>
            <i class="fa-solid fa-hammer"></i>
            Experience
        </h2>
        <div class="absolute">
            <video width="100%" height="100%" autoplay loop muted> 
                <source src ="images/background.mp4" type="video/mp4">
            </video>
        </div>
    </body>
